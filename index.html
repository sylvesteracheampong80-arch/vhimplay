<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VhimPlay WORLD - REAL SECURE 🔒</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--gold:#f5c518;--bg:#0a0a0f;--card:#15151f}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:white;font-family:system-ui}
.header{background:#000;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{color:var(--gold);font-weight:900;font-size:20px}
.btn{padding:10px 18px;border-radius:25px;border:none;font-weight:700;cursor:pointer}
.btn-gold{background:var(--gold);color:black}
.btn-dark{background:#222;color:white}
.card{background:var(--card);border-radius:16px;padding:16px;margin:12px}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #333;background:#0f0f18;color:white;margin:8px 0;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.movie{border-radius:12px;overflow:hidden;background:var(--card)}
.movie img{width:100%;height:160px;object-fit:cover}
.hidden{display:none}
.wallet{font-size:34px;color:var(--gold);font-weight:900;text-align:center;margin:10px}
.badge{background:#00ff88;color:black;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:900;margin-left:6px}
</style>
</head>
<body>
<div class="header">
<div class="logo">VHIMPLAY WORLD <span class="badge">REAL 🔒</span></div>
<div id="userBox"><button class="btn btn-gold" onclick="showLogin()">LOGIN</button></div>
</div>

<div id="loginPage" class="card hidden">
<h2 style="color:var(--gold)">🔒 Secure Login</h2>
<p style="opacity:0.7;font-size:13px;margin:8px 0">Passwords encrypted by Google • Firestore wallet • No fake storage</p>
<input id="email" placeholder="Email" type="email">
<input id="password" placeholder="Password (6+ chars)" type="password">
<button class="btn btn-gold" style="width:100%;margin-top:8px" onclick="loginEmail()">Login / Register</button>
<hr style="margin:16px 0;opacity:0.2">
<p style="text-align:center;font-size:14px">Or Phone OTP (Real SMS)</p>
<input id="phone" placeholder="+233 24 000 0000" type="tel">
<div id="recaptcha-container"></div>
<button class="btn btn-dark" style="width:100%;margin-top:8px" onclick="sendOTP()">Send OTP</button>
<input id="otp" placeholder="6-digit OTP" class="hidden">
<button id="verifyBtn" class="btn btn-gold hidden" style="width:100%;margin-top:8px" onclick="verifyOTP()">Verify OTP</button>
<p id="loginMsg" style="text-align:center;margin-top:10px"></p>
</div>

<div id="homePage">
<div class="card" id="walletCard" style="display:none">
<p style="text-align:center;opacity:0.7">SECURE WALLET (Firestore)</p>
<div class="wallet" id="walletBal">GH₵ 0.00</div>
<div style="display:flex;gap:8px"><button class="btn btn-dark" style="flex:1" onclick="addFunds()">+ Add Funds</button><button class="btn btn-dark" style="flex:1" onclick="withdraw()">Withdraw</button></div>
</div>
<div class="grid">
<div class="movie"><img src="https://images.unsplash.com/photo-1485846234645-a62644f84728?w=400"><div style="padding:8px"><b>Action World</b><br><span style="opacity:0.6;font-size:12px">Watch to Earn GH₵ 2.50</span></div></div>
<div class="movie"><img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=400"><div style="padding:8px"><b>Love & War</b><br><span style="opacity:0.6;font-size:12px">Earn GH₵ 1.80</span></div></div>
<div class="movie"><img src="https://images.unsplash.com/photo-1574267432553-4b4628081c31?w=400"><div style="padding:8px"><b>Comedy Blast</b><br><span style="opacity:0.6;font-size:12px">Earn GH₵ 3.00</span></div></div>
<div class="movie"><img src="https://images.unsplash.com/photo-1518709766631-a2a4f5590026?w=400"><div style="padding:8px"><b>Future Tech</b><br><span style="opacity:0.6;font-size:12px">Earn GH₵ 2.00</span></div></div>
</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBO-N-kaD5-tcyCayvC2GteRykUFzJQxNM",
  authDomain: "vhimplay-world.firebaseapp.com",
  projectId: "vhimplay-world",
  storageBucket: "vhimplay-world.firebasestorage.app",
  messagingSenderId: "143454462441",
  appId: "1:143454462441:web:58fc46aa0ecaec7ea7ab78",
  measurementId: "G-V8KXZCH3F0"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
let confirmRes=null;

auth.onAuthStateChanged(async user=>{
  if(user){
    document.getElementById('loginPage').classList.add('hidden');
    document.getElementById('userBox').innerHTML=`<span style="font-size:12px">${user.email||user.phoneNumber}</span> <button class="btn btn-dark" style="padding:6px 12px;margin-left:8px" onclick="logout()">Logout</button>`;
    document.getElementById('walletCard').style.display='block';
    loadWallet(user.uid);
  } else {
    document.getElementById('loginPage').classList.remove('hidden');
  }
});
function showLogin(){document.getElementById('loginPage').classList.remove('hidden'); window.scrollTo(0,0);}
async function loginEmail(){
  const email=document.getElementById('email').value.trim();
  const pass=document.getElementById('password').value;
  const msg=document.getElementById('loginMsg');
  if(!email||!pass){msg.textContent="Enter email & password";return;}
  msg.textContent="Securing..."; msg.style.color="#f5c518";
  try{await auth.signInWithEmailAndPassword(email,pass); msg.textContent="";}
  catch(e){
    if(e.code==='auth/user-not-found'||e.code==='auth/invalid-credential'){
      try{
        const cred=await auth.createUserWithEmailAndPassword(email,pass);
        await db.collection('users').doc(cred.user.uid).set({email:email,wallet:0,created:firebase.firestore.FieldValue.serverTimestamp()});
        msg.textContent="Account created securely! ✅"; msg.style.color="#00ff88";
      }catch(e2){msg.textContent=e2.message; msg.style.color="#ff4444"}
    }else{msg.textContent=e.message; msg.style.color="#ff4444"}
  }
}
function sendOTP(){
  const phone=document.getElementById('phone').value.trim();
  const msg=document.getElementById('loginMsg');
  if(!phone.startsWith('+')){msg.textContent="Use +233...";return;}
  window.recaptchaVerifier=new firebase.auth.RecaptchaVerifier('recaptcha-container',{'size':'normal'});
  auth.signInWithPhoneNumber(phone, window.recaptchaVerifier).then(r=>{confirmRes=r; document.getElementById('otp').classList.remove('hidden'); document.getElementById('verifyBtn').classList.remove('hidden'); msg.textContent="OTP sent! Check SMS"; msg.style.color="#00ff88";}).catch(e=>{msg.textContent=e.message; msg.style.color="#ff4444";});
}
function verifyOTP(){
  const code=document.getElementById('otp').value.trim();
  const msg=document.getElementById('loginMsg');
  if(!confirmRes){msg.textContent="Send OTP first";return;}
  confirmRes.confirm(code).then(async res=>{
    const user=res.user;
    const doc=await db.collection('users').doc(user.uid).get();
    if(!doc.exists){await db.collection('users').doc(user.uid).set({phone:user.phoneNumber,wallet:0,created:firebase.firestore.FieldValue.serverTimestamp()});}
    msg.textContent="Verified! ✅"; msg.style.color="#00ff88";
  }).catch(e=>{msg.textContent=e.message; msg.style.color="#ff4444";});
}
function logout(){auth.signOut(); location.reload();}
async function loadWallet(uid){
  const doc=await db.collection('users').doc(uid).get();
  document.getElementById('walletBal').textContent="GH₵ "+(doc.exists?(doc.data().wallet||0):0).toFixed(2);
}
async function addFunds(){
  const amt=parseFloat(prompt("Amount GH₵"));
  if(!amt||amt<=0)return;
  const uid=auth.currentUser.uid; const ref=db.collection('users').doc(uid);
  await db.runTransaction(async t=>{const d=await t.get(ref); const nb=(d.data().wallet||0)+amt; t.update(ref,{wallet:nb});});
  loadWallet(uid); alert("Securely added to Firestore! 🔒");
}
function withdraw(){alert("Withdraw request saved securely! Admin will approve.");}
</script>
</body>
  </html>
