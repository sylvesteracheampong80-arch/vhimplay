<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>VhimPlay WORLD - TikTok Style</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto}
body{background:#000;color:#fff;overflow:hidden;height:100vh}
.header{position:fixed;top:0;width:100%;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:12px 15px;background:linear-gradient(180deg,rgba(0,0,0,0.8),transparent)}
.logo{font-weight:900;font-size:20px;letter-spacing:-0.5px}
.logo span{color:#fe2c55}
.filters{display:flex;gap:15px;font-weight:700;font-size:15px;opacity:0.7}
.filters .active{opacity:1;border-bottom:2px solid #fff;padding-bottom:3px}
.wallet{font-size:13px;background:rgba(255,255,255,0.15);padding:5px 10px;border-radius:20px}
.feed{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory}
.post{height:100vh;width:100%;position:relative;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;background:#111}
.post video,.post img{width:100%;height:100%;object-fit:cover}
.overlay{position:absolute;bottom:0;left:0;right:0;padding:20px 70px 90px 15px;background:linear-gradient(0deg,rgba(0,0,0,0.8),transparent)}
.user{font-weight:700;margin-bottom:5px} .caption{font-size:13px;opacity:0.9;line-height:1.3}
.right-bar{position:absolute;right:10px;bottom:110px;display:flex;flex-direction:column;gap:22px;align-items:center}
.icon-btn{width:48px;height:48px;background:rgba(255,255,255,0.1);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;backdrop-filter:blur(10px)}
.icon-btn.loved{background:#fe2c55}
.count{font-size:12px;font-weight:600;margin-top:4px}
.go-live{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#fe2c55;color:#fff;border:none;padding:12px 28px;border-radius:30px;font-weight:900;font-size:15px;z-index:50;box-shadow:0 5px 20px rgba(254,44,85,0.5)}
.bottom{position:fixed;bottom:0;width:100%;background:#000;display:flex;justify-content:space-around;padding:10px 0 20px;border-top:1px solid #222;z-index:100}
.nav{font-size:10px;text-align:center;opacity:0.5} .nav.active{opacity:1} .nav b{font-size:20px;display:block}
.login{position:fixed;inset:0;background:#000;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:340px;background:#121212;border:1px solid #222;padding:25px;border-radius:16px}
.card h1{font-size:28px;font-weight:900;margin-bottom:15px} .card h1 span{color:#fe2c55}
input{width:100%;padding:14px;background:#222;border:1px solid #333;border-radius:8px;color:#fff;margin-bottom:12px;font-size:15px}
.btn{width:100%;padding:14px;background:#fe2c55;color:#fff;border:none;border-radius:8px;font-weight:800;font-size:16px}
.small{font-size:11px;opacity:0.5;text-align:center;margin-top:12px}
</style>
</head>
<body>
<div id="login" class="login">
<div class="card">
<h1>VhimPlay<span>WORLD</span> 🌍</h1>
<input id="phone" placeholder="Phone number">
<input id="pass" type="password" placeholder="Password">
<button class="btn" onclick="join()">Join TikTok World</button>
<div class="small">Admin: 0240000000 / admin<br>From Ghana 🇬🇭 To The World 🌍<br>₵125 Bonus on signup</div>
</div>
</div>

<div class="header">
<div class="logo">VhimPlay <span>WORLD</span></div>
<div class="filters"><span class="active">World</span><span>Ghana</span><span>Live</span></div>
<div class="wallet" id="wallet">₵125</div>
</div>

<div class="feed" id="feed"></div>

<div class="right-bar">
<div style="text-align:center"><div class="icon-btn" onclick="like(this)">❤️</div><div class="count">12.5K</div></div>
<div style="text-align:center"><div class="icon-btn">💬</div><div class="count">856</div></div>
<div style="text-align:center"><div class="icon-btn">🔗</div><div class="count">Share</div></div>
<div style="text-align:center"><div class="icon-btn">💰</div><div class="count">Gift</div></div>
</div>

<button class="go-live" onclick="golive()">+ GO LIVE 🌍</button>

<div class="bottom">
<div class="nav active"><b>🏠</b>Home</div>
<div class="nav"><b>🔍</b>Discover</div>
<div class="nav" style="opacity:1"><b style="background:#fff;color:#000;padding:3px 10px;border-radius:6px">+</b></div>
<div class="nav"><b>💼</b>Wallet</div>
<div class="nav"><b>👤</b>Profile</div>
</div>

<script>
let bal=125;
const vids=[
{user:"@kwame_ghana 🇬🇭",cap:"Kumasi to the WORLD! 🌍 Dancing in Kejetia market #vhimplay #ghana",img:"https://images.unsplash.com/photo-1506794778202-cad84cf45f1d"},
{user:"@amara_nigeria 🇳🇬",cap:"Lagos vibes 🔥 Who's watching from Ghana? Let's connect! #afrobeats",img:"https://images.unsplash.com/photo-1531746020798-e6953c6e8e04"},
{user:"@sarah_usa 🇺🇸",cap:"Just discovered Ghanaian music 😍 So good! From USA to Ghana ❤️",img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1"},
{user:"@tech_bro_kumasi 🇬🇭",cap:"Building VhimPlay WORLD from Kumasi laptop 💻 We go global!",img:"https://images.unsplash.com/photo-1517841905240-472988babdf9"},
{user:"@world_traveler 🌍",cap:"Your content can reach 8 BILLION people here. Start now.",img:"https://images.unsplash.com/photo-1526772661823-3f88f33771f7"}
];
const feed=document.getElementById('feed');
function render(){
feed.innerHTML=vids.map(v=>`
<div class="post">
<img src="${v.img}?w=600&q=80">
<div class="overlay">
<div class="user">${v.user} • 🌍 WORLD</div>
<div class="caption">${v.cap}</div>
</div>
</div>`).join('');
}
render();
function join(){
const p=document.getElementById('phone').value;
if(!p){alert('Enter phone');return}
document.getElementById('login').style.display='none';
document.getElementById('wallet').innerText='₵'+bal;
if(p==='0240000000') alert('👑 ADMIN MODE - You control WORLD withdrawals');
else alert('Welcome to WORLD! ₵125 bonus added!');
}
function like(el){el.classList.toggle('loved');}
function golive(){
bal+=5;
document.getElementById('wallet').innerText='₵'+bal;
alert('🔴 LIVE TO WORLD! Viewers from Ghana, Nigeria, USA joining... +₵5 earned');
}
</script>
</body>
</html>
