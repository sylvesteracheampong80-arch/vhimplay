<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VhimPlay WORLD - FYP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#000;color:#fff;height:100vh;overflow:hidden}
.top{position:fixed;top:0;width:100%;z-index:99;background:rgba(0,0,0,0.6);backdrop-filter:blur(10px)}
.top2{display:flex;justify-content:space-between;padding:12px 15px;font-size:14px}
.tabs{display:flex;justify-content:center;gap:22px;padding:8px 0 12px;font-weight:600;font-size:16px;color:#aaa}
.tabs span.active{color:#fff;border-bottom:3px solid #fff;padding-bottom:4px}
.tabs span.stem{background:#0ff;color:#000;padding:2px 8px;border-radius:4px;font-size:13px}
.feed{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory}
.post{height:100vh;scroll-snap-align:start;position:relative;background:#111;display:flex;align-items:center;justify-content:center}
.post img{width:100%;height:100%;object-fit:cover}
.info{position:absolute;bottom:95px;left:12px;right:75px}
.user{font-weight:800;font-size:16px} .desc{font-size:13px;margin:6px 0;line-height:1.3} .music{font-size:12px;opacity:0.8}
.actions{position:absolute;right:10px;bottom:110px;display:flex;flex-direction:column;gap:20px;text-align:center}
.a{width:50px}
.ava{width:50px;height:50px;border-radius:50%;border:2px solid #fff;background-size:cover;margin-bottom:18px;position:relative}
.plus{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:#fe2c55;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px}
.icon{width:48px;height:48px;background:rgba(255,255,255,0.15);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px}
.num{font-size:12px;font-weight:600;margin-top:4px}
.nav{position:fixed;bottom:0;width:100%;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0 18px;z-index:99}
.n{font-size:10px;text-align:center;color:#888} .n.active{color:#fff} .n b{font-size:22px;display:block}
.center{width:42px;height:28px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:22px;position:relative}
.center::before{content:'';position:absolute;left:-4px;top:1px;width:100%;height:100%;background:#25f4ee;border-radius:8px;z-index:-1}
.center::after{content:'';position:absolute;right:-4px;top:1px;width:100%;height:100%;background:#fe2c55;border-radius:8px;z-index:-2}
.login{position:fixed;inset:0;background:#000;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:340px;background:#1a1a1a;border-radius:16px;padding:24px}
input{width:100%;padding:14px;background:#2a2a2a;border:none;border-radius:8px;color:#fff;margin-bottom:10px}
.btn{width:100%;padding:14px;background:#fe2c55;color:#fff;border:none;border-radius:8px;font-weight:800;font-size:16px}
.live-btn{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,#fe2c55,#25f4ee);padding:10px 20px;border-radius:20px;font-weight:800;z-index:50;border:none;color:#fff}
</style>
</head>
<body>
<div id="log" class="login"><div class="box">
<h2 style="font-size:28px;font-weight:900;margin-bottom:6px">VhimPlay 🌍</h2>
<p style="font-size:13px;opacity:0.6;margin-bottom:15px">From Ghana to The World - For You</p>
<input id="ph" placeholder="Phone or email"><input id="pw" type="password" placeholder="Password">
<button class="btn" onclick="go()">Log in to WORLD</button>
<p style="font-size:11px;opacity:0.4;text-align:center;margin-top:10px">Admin: 0240000000 / admin<br>FYP • Following • STEM • LIVE</p>
</div></div>

<div class="top">
<div class="top2"><span>📺 LIVE</span><span id="bal" style="background:rgba(255,255,255,0.15);padding:4px 10px;border-radius:20px">₵125</span></div>
<div class="tabs">
<span>Following</span><span class="active">For You</span><span class="stem">STEM</span><span>Shop</span><span>LIVE</span>
</div>
</div>

<div class="feed" id="feed"></div>

<div class="actions">
<div class="a"><div class="ava" style="background-image:url(https://i.pravatar.cc/100?img=1)"><div class="plus">+</div></div></div>
<div class="a"><div class="icon" onclick="this.style.background='#fe2c55'">❤️</div><div class="num">45.2K</div></div>
<div class="a"><div class="icon">💬</div><div class="num">892</div></div>
<div class="a"><div class="icon">🔖</div><div class="num">Save</div></div>
<div class="a"><div class="icon">↗️</div><div class="num">Share</div></div>
<div class="a"><div class="ava" style="background-image:url(https://i.pravatar.cc/100?img=2);width:48px;height:48px;border:none"></div></div>
</div>

<button class="live-btn" onclick="live()">+ GO LIVE</button>

<div class="nav">
<div class="n active"><b>🏠</b>Home</div>
<div class="n"><b>🔍</b>Friends</div>
<div class="n"><div class="center">+</div></div>
<div class="n"><b>💬</b>Inbox</div>
<div class="n"><b>👤</b>Profile</div>
</div>

<script>
const posts=[
{u:"@kumasi_dancer 🇬🇭",d:"Kumasi dancers taking over FYP! 🌍 #ghanatotheworld #fyp #viral",m:"♫ Original sound - VhimPlay WORLD",i:"https://images.unsplash.com/photo-1518834107812-67b0b288f498?w=600"},
{u:"@stem_ghana 🔬",d:"How we built VhimPlay from Kumasi laptop! STEM explained #stem #tech #ghana",m:"♫ STEM Tok - Learn with us",i:"https://images.unsplash.com/photo-1507413245164-6160d8298b31?w=600"},
{u:"@nigeria_comedy 🇳🇬",d:"When your Ghana friend says he has WORLD app 😂 #comedy #nigeria",m:"♫ Funny sound - 2.3M videos",i:"https://images.unsplash.com/photo-1517841905240-472988babdf9?w=600"},
{u:"@usa_reacts 🇺🇸",d:"Reacting to Ghana jollof for first time!! So good! #food #ghana",m:"♫ Afrobeat - Trending",i:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=600"},
{u:"@vhim_official 🌍",d:"FYP = For Your Planet. Your video can hit 8B views. Post now! #fyp",m:"♫ VhimPlay Anthem",i:"https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=600"}
];
document.getElementById('feed').innerHTML=posts.map(p=>`
<div class="post"><img src="${p.i}">
<div class="info"><div class="user">${p.u}</div><div class="desc">${p.d}</div><div class="music">${p.m}</div></div></div>
`).join('');
let b=125;
function go(){document.getElementById('log').style.display='none';}
function live(){b+=5;document.getElementById('bal').innerText='₵'+b;alert('🔴 LIVE on For You Page! STEM & World watching 🌍');}
</script>
</body>
</html>
